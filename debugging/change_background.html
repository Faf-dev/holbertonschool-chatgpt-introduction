<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Background Color</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
        transition: background-color 0.5s; /* Ajout d'une transition pour un effet plus doux */
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none; /* Suppression de la bordure par défaut */
        border-radius: 5px; /* Ajout d'un arrondi */
        background-color: #007BFF; /* Couleur de fond du bouton */
        color: white; /* Couleur du texte du bouton */
        transition: background-color 0.3s; /* Transition pour le bouton */
    }
    button:hover {
        background-color: #0056b3; /* Couleur au survol */
    }
</style>
</head>
<body>

<h2>Click the button to change the background color</h2>

<button id="colorButton" type="button">Change Color</button>

<script>
    document.getElementById("colorButton").addEventListener("click", function() {
        changeBackgroundColor();
    });

    function changeBackgroundColor() {
        /* Générer une couleur aléatoire */
        var randomColor = "#" + Math.floor(Math.random() 16777215).toString(16).padStart(6, '0');
        /* Changer la couleur de fond du corps */
        document.body.style.backgroundColor = randomColor;
    }
</script>

</body>
</html>
